<!DOCTYPE html>
<html lang="ru" style="--tg-viewport-height: 100vh; --tg-viewport-stable-height: 100vh;"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>План на день</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1c1c22;
      --card-hover: #25252d;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 90px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Панель авто-установки на GitHub (видна только с компьютера) */
    .setup-wizard {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #3b82f6;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      display: none;
    }
    .setup-wizard h3 { font-size: 16px; margin-bottom: 8px; color: #60a5fa; }
    .setup-wizard p { font-size: 13px; color: #cbd5e1; line-height: 1.4; margin-bottom: 10px; }
    .setup-wizard a { color: #60a5fa; font-weight: 600; text-decoration: underline; }
    .setup-input {
      width: 100%;
      background: #0f0f12;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      outline: none;
    }
    .setup-btn {
      width: 100%;
      background: #10b981;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .setup-btn:disabled { opacity: 0.6; cursor: wait; }
    .setup-result {
      margin-top: 12px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      word-break: break-all;
    }

    /* Шапка и переключение дней */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .date-nav {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); padding: 8px 14px; border-radius: 14px;
      width: 100%; justify-content: space-between;
    }
    .nav-btn { background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 4px 10px; border-radius: 8px; }
    .nav-btn:active { background: var(--card-hover); }
    .current-date { font-weight: 700; font-size: 16px; text-align: center; cursor: pointer; }
    .current-date span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }

    /* Прогресс бар */
    .progress-wrap {
      background: var(--card); border-radius: 12px; padding: 12px 14px;
      margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .progress-bar-bg { flex: 1; height: 8px; background: #2c2c35; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
    .progress-text { font-size: 13px; color: var(--muted); font-weight: 600; min-width: 45px; text-align: right; }

    /* Форма добавления */
    .add-box { background: var(--card); padding: 12px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #2c2c35; }
    .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .time-input { background: var(--bg); border: 1px solid #2c2c35; color: var(--text); padding: 10px; border-radius: 10px; font-size: 14px; width: 90px; outline: none; }
    .task-input { flex: 1; background: var(--bg); border: 1px solid #2c2c35; color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 15px; outline: none; }
    .task-input:focus, .time-input:focus { border-color: var(--accent); }
    .tags-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
    .tags-row::-webkit-scrollbar { display: none; }
    .tag-btn { background: var(--bg); border: 1px solid #2c2c35; color: var(--muted); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .tag-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .add-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 11px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .add-btn:active { opacity: 0.85; }

    /* Список задач */
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-card { background: var(--card); padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
    .task-card.done { opacity: 0.5; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--muted); }
    .checkbox { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .task-card.done .checkbox { background: var(--success); border-color: var(--success); }
    .checkbox::after { content: '✓'; color: #fff; font-size: 14px; display: none; }
    .task-card.done .checkbox::after { display: block; }
    .task-content { flex: 1; min-width: 0; cursor: pointer; }
    .task-title { font-size: 15px; font-weight: 500; word-wrap: break-word; margin-bottom: 4px; }
    .task-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .task-time { color: var(--accent); font-weight: 600; background: rgba(59, 130, 246, 0.12); padding: 2px 7px; border-radius: 6px; }
    .task-tag { color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 6px; }
    .del-btn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }
    .del-btn:hover { color: var(--danger); }
    .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

    /* Нижние кнопки */
    .bottom-actions { margin-top: 20px; display: flex; gap: 10px; }
    .sec-btn { flex: 1; background: var(--card); color: var(--muted); border: 1px solid #2c2c35; padding: 10px; border-radius: 12px; font-size: 13px; cursor: pointer; }
    .sec-btn:active { background: var(--card-hover); color: var(--text); }
    .sync-status { text-align: center; font-size: 11px; color: var(--muted); margin-top: 14px; }
  </style>
</head>
<body>

  <!-- Встроенный авто-установщик (показывается только при открытии файла с компьютера) -->
  

  <div class="header">
    <div class="date-nav">
      <button class="nav-btn" onclick="changeDay(-1)">❮</button>
      <div class="current-date" onclick="goToday()">
        <div id="dateTitle">Сегодня</div>
        <span id="dateSub">Вс, 25 октября</span>
      </div>
      <button class="nav-btn" onclick="changeDay(1)">❯</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>

  <div class="add-box">
    <div class="input-row">
      <input type="time" id="timeInput" class="time-input">
      <input type="text" id="taskInput" class="task-input" placeholder="Что нужно сделать?" onkeypress="if(event.key==='Enter') addTask()">
    </div>
    <div class="tags-row" id="tagsRow">
      <button class="tag-btn active" onclick="selectTag(this, '🔥 Важное')">🔥 Важное</button>
      <button class="tag-btn" onclick="selectTag(this, '🎬 Монтаж')">🎬 Монтаж</button>
      <button class="tag-btn" onclick="selectTag(this, '🎥 Съемка')">🎥 Съемка</button>
      <button class="tag-btn" onclick="selectTag(this, '🎓 Учеба')">🎓 Учеба</button>
      <button class="tag-btn" onclick="selectTag(this, '💪 Спорт')">💪 Спорт</button>
      <button class="tag-btn" onclick="selectTag(this, '📌 Личное')">📌 Личное</button>
    </div>
    <button class="add-btn" onclick="addTask()">+ Добавить в план</button>
  </div>

  <div class="task-list" id="taskList"><div class="empty-state">На этот день задач пока нет.<br>Добавь первую сверху 👆</div></div>

  <div class="bottom-actions">
    <button class="sec-btn" onclick="moveUnfinishedToTomorrow()">➡ Перенести невыполненные на завтра</button>
    <button class="sec-btn" onclick="clearDone()">🗑 Очистить готовые</button>
  </div>

  <div class="sync-status" id="syncStatus">💾 Режим браузера (открой в Telegram для синхронизации)</div>

  <script>
    // Показываем мастер авто-выгрузки только если файл открыт локально на ноуте
    if (location.protocol === 'file:') {
      document.getElementById('setupWizard').style.display = 'block';
    }

    // Функция автоматического создания репозитория и включения GitHub Pages
    async function autoDeployToGitHub() {
      const token = document.getElementById('ghToken').value.trim();
      const btn = document.getElementById('deployBtn');
      const resBox = document.getElementById('setupResult');

      if (!token) { alert('Сначала вставь токен!'); return; }
      btn.disabled = true;
      btn.innerText = '⏳ Подключаюсь к GitHub...';

      const headers = {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };

      try {
        // 1. Узнаем логин пользователя
        const userRes = await fetch('https://api.github.com/user', { headers });
        if (!userRes.ok) throw new Error('Неверный токен. Проверь, что скопировал его полностью.');
        const user = await userRes.json();
        const username = user.login;
        const repoName = 'tg-day-planner';

        // 2. Создаем репозиторий (если его еще нет)
        btn.innerText = '⏳ Создаю репозиторий...';
        await fetch('https://api.github.com/user/repos', {
          method: 'POST',
          headers,
          body: JSON.stringify({ name: repoName, private: false, auto_init: true })
        });

        await new Promise(r => setTimeout(r, 1500));

        // 3. Готовим чистый HTML код без панели установщика
        btn.innerText = '⏳ Загружаю код планера...';
        const clone = document.documentElement.cloneNode(true);
        const wiz = clone.querySelector('#setupWizard');
        if (wiz) wiz.remove();
        const cleanHtml = '<!DOCTYPE html>\n' + clone.outerHTML;
        const base64Content = btoa(unescape(encodeURIComponent(cleanHtml)));

        // Проверяем, есть ли уже index.html
        let sha = undefined;
        const existingFile = await fetch(`https://api.github.com/repos/${username}/${repoName}/contents/index.html`, { headers });
        if (existingFile.ok) {
          const fileData = await existingFile.json();
          sha = fileData.sha;
        }

        const putRes = await fetch(`https://api.github.com/repos/${username}/${repoName}/contents/index.html`, {
          method: 'PUT',
          headers,
          body: JSON.stringify({
            message: 'Auto deploy planner',
            content: base64Content,
            sha: sha
          })
        });
        if (!putRes.ok) throw new Error('Не удалось загрузить файл index.html');

        // 4. Включаем GitHub Pages
        btn.innerText = '⏳ Включаю GitHub Pages...';
        await fetch(`https://api.github.com/repos/${username}/${repoName}/pages`, {
          method: 'POST',
          headers: { ...headers, 'Accept': 'application/vnd.github.switcheroo-preview+json' },
          body: JSON.stringify({ source: { branch: 'main', path: '/' } })
        });

        const finalUrl = `https://${username}.github.io/${repoName}/`;
        btn.innerText = '✅ Успешно опубликовано!';
        resBox.style.display = 'block';
        resBox.innerHTML = `
          <b>🎉 Сайт готов! Твоя ссылка для Telegram:</b><br><br>
          <a href="${finalUrl}" target="_blank" style="font-size:15px;">${finalUrl}</a><br><br>
          <span style="color:#cbd5e1;">(GitHub активирует ссылку примерно через 60 секунд. Скопируй её и отправь боту <b>@BotFather</b>).</span>
        `;
      } catch (err) {
        btn.disabled = false;
        btn.innerText = '⚡ Попробовать снова';
        alert('Ошибка: ' + err.message);
      }
    }

    const tg = window.Telegram?.WebApp;
    let isTelegramCloud = false;

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage) {
        isTelegramCloud = true;
      }
    }

    let currentDate = new Date();
    let selectedTag = '🔥 Важное';
    let allTasks = {};

    function getDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayDate(date) {
      const todayKey = getDateKey(new Date());
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
      const key = getDateKey(date);

      const options = { weekday: 'short', day: 'numeric', month: 'long' };
      const formatted = date.toLocaleDateString('ru-RU', options);

      if (key === todayKey) return { main: 'Сегодня', sub: formatted };
      if (key === getDateKey(tomorrow)) return { main: 'Завтра', sub: formatted };
      if (key === getDateKey(yesterday)) return { main: 'Вчера', sub: formatted };
      return { main: formatted, sub: 'Нажми, чтобы вернуться к Сегодня' };
    }

    function selectTag(btn, tag) {
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedTag = tag;
    }

    function changeDay(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      render();
    }

    function goToday() {
      currentDate = new Date();
      render();
    }

    function saveData() {
      const key = getDateKey(currentDate);
      const dayTasks = allTasks[key] || [];
      localStorage.setItem('planner_tasks', JSON.stringify(allTasks));

      if (isTelegramCloud) {
        document.getElementById('syncStatus').innerText = '☁️ Сохранение в облако Telegram...';
        tg.CloudStorage.setItem('day_' + key, JSON.stringify(dayTasks), (err) => {
          if (!err) {
            document.getElementById('syncStatus').innerText = '☁️ Синхронизировано (Telegram Cloud)';
          } else {
            document.getElementById('syncStatus').innerText = '⚠️ Ошибка облака, сохранено локально';
          }
        });
      } else {
        document.getElementById('syncStatus').innerText = '💾 Сохранено в памяти браузера';
      }
    }

    function loadDayData(dateKey, callback) {
      if (isTelegramCloud) {
        tg.CloudStorage.getItem('day_' + dateKey, (err, val) => {
          if (!err && val) {
            try { allTasks[dateKey] = JSON.parse(val); } catch(e) {}
          }
          document.getElementById('syncStatus').innerText = '☁️ Синхронизировано (Telegram Cloud)';
          callback();
        });
      } else {
        const local = localStorage.getItem('planner_tasks');
        if (local) {
          try { allTasks = JSON.parse(local); } catch(e) {}
        }
        document.getElementById('syncStatus').innerText = '💾 Режим браузера (открой в Telegram для синхронизации)';
        callback();
      }
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const timeInput = document.getElementById('timeInput');
      const text = input.value.trim();
      if (!text) return;

      const key = getDateKey(currentDate);
      if (!allTasks[key]) allTasks[key] = [];

      allTasks[key].push({
        id: Date.now(),
        text: text,
        time: timeInput.value || '',
        tag: selectedTag,
        done: false
      });

      allTasks[key].sort((a, b) => {
        if (a.time && b.time) return a.time.localeCompare(b.time);
        if (a.time) return -1;
        if (b.time) return 1;
        return 0;
      });

      input.value = '';
      timeInput.value = '';
      saveData();
      renderList();
    }

    function toggleTask(id) {
      const key = getDateKey(currentDate);
      const task = (allTasks[key] || []).find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        saveData();
        renderList();
      }
    }

    function deleteTask(id) {
      const key = getDateKey(currentDate);
      allTasks[key] = (allTasks[key] || []).filter(t => t.id !== id);
      saveData();
      renderList();
    }

    function clearDone() {
      const key = getDateKey(currentDate);
      allTasks[key] = (allTasks[key] || []).filter(t => !t.done);
      saveData();
      renderList();
    }

    function moveUnfinishedToTomorrow() {
      const todayKey = getDateKey(currentDate);
      const tasks = allTasks[todayKey] || [];
      const unfinished = tasks.filter(t => !t.done);
      if (!unfinished.length) return;

      const nextDay = new Date(currentDate);
      nextDay.setDate(nextDay.getDate() + 1);
      const nextKey = getDateKey(nextDay);

      loadDayData(nextKey, () => {
        if (!allTasks[nextKey]) allTasks[nextKey] = [];
        unfinished.forEach(t => {
          allTasks[nextKey].push({ ...t, id: Date.now() + Math.random() });
        });
        allTasks[todayKey] = tasks.filter(t => t.done);
        saveData();
        if (isTelegramCloud) {
          tg.CloudStorage.setItem('day_' + nextKey, JSON.stringify(allTasks[nextKey]));
        }
        renderList();
      });
    }

    function render() {
      const key = getDateKey(currentDate);
      const disp = formatDisplayDate(currentDate);
      document.getElementById('dateTitle').innerText = disp.main;
      document.getElementById('dateSub').innerText = disp.sub;

      loadDayData(key, () => {
        renderList();
      });
    }

    function renderList() {
      const key = getDateKey(currentDate);
      const tasks = allTasks[key] || [];
      const listEl = document.getElementById('taskList');

      const doneCount = tasks.filter(t => t.done).length;
      const total = tasks.length;
      const percent = total ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressText').innerText = `${doneCount} / ${total}`;

      if (!tasks.length) {
        listEl.innerHTML = `<div class="empty-state">На этот день задач пока нет.<br>Добавь первую сверху 👆</div>`;
        return;
      }

      listEl.innerHTML = tasks.map(t => `
        <div class="task-card ${t.done ? 'done' : ''}">
          <div class="checkbox" onclick="toggleTask(${t.id})"></div>
          <div class="task-content" onclick="toggleTask(${t.id})">
            <div class="task-title">${escapeHtml(t.text)}</div>
            <div class="task-meta">
              ${t.time ? `<span class="task-time">⏰ ${t.time}</span>` : ''}
              <span class="task-tag">${t.tag}</span>
            </div>
          </div>
          <button class="del-btn" onclick="deleteTask(${t.id})">✕</button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    render();
  </script>

</body></html>
